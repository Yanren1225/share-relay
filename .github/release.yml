# GitHub 自动 Release Notes 的 PR 分类配置
# 说明：该文件只对「通过 PR 合并」的变更生效；本项目目前是直接 commit 到 main，
# 实际 notes 由 .github/workflows/release.yml 里按 commit 前缀（feat/fix/...）生成。
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 新功能
      labels:
        - feature
        - enhancement
    - title: 修复
      labels:
        - bug
        - fix
    - title: 文档与构建
      labels:
        - documentation
        - ci
        - build
    - title: 其他
      labels:
        - "*"
