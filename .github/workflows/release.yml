# 发布流程（打 tag 自动发版）
# -----------------------------------------------------------------------------
# 1. 版本号规则：tag vMAJOR.MINOR.PATCH → versionName=MAJOR.MINOR.PATCH，
#    versionCode=MAJOR*10000+MINOR*100+PATCH（v0.2.0 → 200）；tag 格式不对会直接失败。
# 2. 日常发版：
#      git add -A && git commit -m "feat: xxx" && git push origin main
#      git tag v0.2.0 && git push origin v0.2.0
#    推送 tag 后本 workflow 自动：装 JDK 17 / SDK 37 → 恢复 keystore → assembleRelease
#    → apksigner 验签 → gh release create --generate-notes。
# 3. 仓库 Secrets（Settings → Secrets and variables → Actions）：
#      ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
#    keystore 为 keystore/release.jks（本地不入库），base64 生成：
#      [Convert]::ToBase64String([IO.File]::ReadAllBytes('keystore/release.jks'))
# 4. 本地兜底发版：./gradlew assembleRelease -PversionName=x.y.z -PversionCode=xxxx，
#    apksigner verify 后 gh release create 手动上传。
# 5. 重发：gh release delete vX.Y.Z --yes；git tag -d vX.Y.Z；
#    git push origin :refs/tags/vX.Y.Z；修正后重新打 tag 推送。
# 6. 坑：不要用 android-actions/setup-android（新 runner 报 Failed to find package 'tools'），
#    改用预装 SDK + sdkmanager 安装 platforms;android-37.0 与 build-tools;36.0.0，
#    并软链 platforms/android-37 → android-37.0，否则 AGP 找不到 SDK 37。
# -----------------------------------------------------------------------------
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not look like vMAJOR.MINOR.PATCH"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          {
            echo "VERSION=$VERSION"
            echo "VERSION_CODE=$CODE"
            echo "APK_NAME=ShareRelay-$VERSION.apk"
          } >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 直接使用 runner 预装的 Android SDK（setup-android 在新 runner 上会因 'tools' 包缺失而失败）
      # SDK 37 的包名是 platforms;android-37.0，AGP 需要 platforms/android-37 这个目录名
      - name: Install SDK 37
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK root: $SDK_ROOT"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)
            chmod +x "$SDKMGR"
          fi
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-37.0" "build-tools;36.0.0"
          ln -sfn "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"
          ls "$SDK_ROOT/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="$VERSION_CODE" --console=plain

      - name: Verify signature
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/$APK_NAME"
          ls -lh "out/$APK_NAME"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "out/$APK_NAME" \
            --title "ShareRelay $VERSION" \
            --generate-notes



